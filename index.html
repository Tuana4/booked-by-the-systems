<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BOOKED BY THE SYSTEMS — THE BOX FILES YOU</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- custom cursor -->
  <div id="cursor"></div>

  <!-- overlays -->
  <div id="flash"></div>
  <div id="glitch" class="glitch hidden"></div>
  <div id="rgb" class="rgb hidden"></div>
  <div id="redwash" class="redwash hidden"></div>

  <!-- mute (sound is optional; starts muted) -->
  <button id="muteBtn" class="muter" aria-pressed="true" aria-label="Toggle sound">🔇 sound off</button>
  <audio id="sndClick" src="sounds/click1.mp3" preload="auto"></audio>

  <main class="wrap" id="wrap">
    <header class="mast" id="mast">
      <h1 class="big">BOOKED BY THE SYSTEMS</h1>
      <h2 class="sub">THE BOX FILES YOU</h2>
      <p class="lead">to proceed, agree.</p>
    </header>

    <section class="center" id="center">
      <!-- FULL-SCREEN background words / popups (behind control) -->
      <div id="ghostLayer" class="ghostLayer" aria-hidden="true"></div>

      <!-- consent control (always on top) -->
      <div class="agree-container" id="agreeWrap">
        <input type="checkbox" id="agree" />
        <label for="agree" id="agreeLabel">I AGREE</label>
      </div>
    </section>

    <!-- end: ONLY this line remains -->
    <section id="end" class="end hidden" aria-live="polite">
      <p class="endtext">you shouldn’t have agreed to something you never read.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
