
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BOOKED BY THE SYSTEMS — THE BOX FILES YOU</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- custom transparent cursor -->
  <div id="cursor"></div>

  <!-- red flash -->
  <div id="flash"></div>

  <main class="wrap">
    <!-- TOP-CENTER TITLES -->
    <header class="mast">
      <h1 class="big">BOOKED BY THE SYSTEMS</h1>
      <h2 class="sub">THE BOX FILES YOU</h2>
      <p class="lead">to proceed, agree.</p>
    </header>

    <!-- CENTER INTERACTION -->
    <section class="center" id="center">
      <div class="agree-container">
        <input type="checkbox" id="agree" />
        <label for="agree" id="agreeLabel">I agree</label>
      </div>

      <!-- one-time red word bursts render here -->
      <div id="ghostLayer" class="ghostLayer" aria-hidden="true"></div>
    </section>

    <!-- END SCREEN -->
    <section id="end" class="end hidden" aria-live="polite">
      <p class="endtext">you shouldn’t have agreed to something you never read.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
