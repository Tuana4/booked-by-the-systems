<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BOOKED BY THE SYSTEMS — THE BOX FILES YOU</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- custom cursor -->
  <div id="cursor"></div>

  <!-- overlays -->
  <div id="flash"></div>
  <div id="glitch" class="glitch hidden"></div>
  <div id="surgical" class="surgical hidden"></div>   <!-- NEW: surgical green/scanlines -->
  <div id="slices"   class="slices hidden"></div>     <!-- NEW: misaligned cuts -->
  <div id="redwash" class="redwash hidden"></div>

  <!-- heartbeat trace (only shown during ending) -->
  <svg id="ekg" class="ekg hidden" viewBox="0 0 1200 200" preserveAspectRatio="none" aria-hidden="true">
    <polyline id="ekgLine" points="
      0,120 150,120 180,60 200,180 220,120 400,120
      430,70 450,180 470,120 650,120 900,120 1200,120"
      fill="none" stroke="#00ffa6" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>

  <main class="wrap" id="wrap">
    <header class="mast" id="mast">
      <h1 class="big">BOOKED BY THE SYSTEMS</h1>
      <h2 class="sub">THE BOX FILES YOU</h2>
      <p class="lead">to proceed, agree.</p>
    </header>

    <section class="center" id="center">
      <div id="ghostLayer" class="ghostLayer" aria-hidden="true"></div>
      <div class="agree-container" id="agreeWrap">
        <input type="checkbox" id="agree" />
        <label for="agree" id="agreeLabel">I AGREE</label>
      </div>
    </section>

    <section id="end" class="end hidden" aria-live="polite">
      <p class="endtext">you shouldn’t have agreed to something you never read.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
