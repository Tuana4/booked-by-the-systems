<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BOOKED BY THE SYSTEMS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- custom cursor -->
  <div id="cursor"></div>

  <!-- effect layers -->
  <div id="flash"></div>
  <div id="glitch" class="hidden"></div>
  <div id="rgb" class="hidden"></div>
  <div id="redwash" class="hidden"></div>
  <div id="blocks" class="hidden"></div>
  <div id="crash" class="hidden"></div>

  <main id="wrap" class="wrap">
    <header class="mast">
      <p class="lead">TO PROCEED, AGREE.</p>
    </header>

    <section id="center" class="center">
      <div class="agree-container">
        <input type="checkbox" id="agree" />
        <label id="agreeLabel" for="agree">I AGREE</label>
      </div>

      <!-- bursts & popups (behind control, full-bleed) -->
      <div id="ghostLayer" class="ghostLayer" aria-hidden="true"></div>
    </section>

    <section id="end" class="end hidden" aria-live="polite">
      <p class="endtext">YOU SHOULDN’T HAVE AGREED TO SOMETHING YOU NEVER READ.</p>
    </section>
  </main>

  <!-- click sound (place sound.mp3 next to this file) -->
  <audio id="agreeSound" src="sound.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
