<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BOOKED BY THE SYSTEMS — THE BOX FILES YOU</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- custom cursor -->
  <div id="cursor"></div>

  <!-- overlays -->
  <div id="flash"></div>
  <div id="glitch" class="glitch hidden"></div>
  <div id="redwash" class="redwash hidden"></div>

  <main class="wrap">
    <!-- header (titles kept in DOM; only instruction visible) -->
    <header class="mast">
      <h1 class="big">BOOKED BY THE SYSTEMS</h1>
      <h2 class="sub">THE BOX FILES YOU</h2>
      <p class="lead">to proceed, agree.</p>
    </header>

    <!-- center stage -->
    <section class="center" id="center">
      <!-- background layer (words + popups live here, behind the control) -->
      <div id="ghostLayer" class="ghostLayer" aria-hidden="true"></div>

      <!-- the control (always above background) -->
      <div class="agree-container">
        <input type="checkbox" id="agree" />
        <label for="agree" id="agreeLabel">I AGREE</label>
      </div>
    </section>

    <!-- end screen -->
    <section id="end" class="end hidden" aria-live="polite">
      <p class="endtext">you shouldn’t have agreed to something you never read.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
