<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>BOOKED BY THE SYSTEMS</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <!-- custom glowing cursor -->
  <div id="cursor"></div>

  <!-- flash overlay -->
  <div id="flash"></div>

  <main class="wrap">
    <!-- minimal header -->
    <header class="hint">TO PROCEED, AGREE.</header>

    <!-- center action -->
    <section class="stage">
      <button id="agree" class="agree" aria-label="I agree">I AGREE</button>

      <!-- bursts & popups live here -->
      <div id="layer" class="layer" aria-hidden="true"></div>
    </section>

    <!-- end screen -->
    <section id="end" class="end hidden">
      <p class="endline">you shouldn’t have agreed to something you never read.</p>
      <p class="reload">reloading…</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
